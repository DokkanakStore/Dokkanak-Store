<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دكانك | Dokkanak</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --secondary: #8b5cf6; --dark: #0f172a;
            --glass: rgba(30, 41, 59, 0.8); --glass-strong: rgba(15, 23, 42, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc; --accent: #10b981; --hot: #f43f5e;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: #020617; color: var(--text); padding-bottom: 100px; 
            overflow-x: hidden; font-weight: 700; letter-spacing: 0.5px;
        }

        /* Background Animation */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            z-index: -1; animation: pulseBg 10s infinite alternate;
        }
        @keyframes pulseBg { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        .navbar {
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);
            padding: 15px 20px; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .logo { font-size: 24px; font-weight: 900; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display:flex; align-items:center; gap:10px; letter-spacing: 1px;}
        .logo img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary); box-shadow: 0 0 15px rgba(99,102,241,0.5); }

        .auth-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 10px 20px; border-radius: 50px;
            font-weight: 800; font-family: 'Cairo'; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); transition: 0.3s;
        }
        .auth-btn:active { transform: scale(0.95); }

        .news-bar { background: linear-gradient(90deg, #312e81, #4c1d95); color: #e2e8f0; padding: 10px 0; font-size: 13px; font-weight: 700; overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--border); letter-spacing: 0.5px; }
        .news-content { display: inline-block; animation: marquee 25s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        .search-container { padding: 25px 20px; max-width: 650px; margin: 0 auto; position: relative; }
        .search-inp {
            width: 100%; padding: 16px 50px 16px 20px; border-radius: 25px; border: 1px solid var(--border);
            background: rgba(30, 41, 59, 0.6); color: white; font-family: 'Cairo'; font-size: 16px; font-weight: 600;
            backdrop-filter: blur(5px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .search-inp:focus { border-color: var(--primary); background: rgba(30, 41, 59, 0.95); box-shadow: 0 0 25px rgba(99, 102, 241, 0.25); }
        .search-icon { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); color: var(--primary); font-size: 20px; }

        .category-bar { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 20px; scrollbar-width: none; }
        .category-bar::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #cbd5e1;
            padding: 10px 24px; border-radius: 30px; font-size: 14px; font-weight: 800;
            white-space: nowrap; cursor: pointer; transition: 0.3s; font-family: 'Cairo';
        }
        .cat-btn.active, .cat-btn:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px rgba(99,102,241,0.3); transform: translateY(-2px); }

        .container { padding: 0 15px; max-width: 1100px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
        
        .card {
            background: var(--glass); border-radius: 24px; border: 1px solid var(--border);
            overflow: hidden; position: relative; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card:hover { transform: translateY(-8px); border-color: rgba(99,102,241,0.6); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .hot-badge { 
            position: absolute; top: 15px; left: 15px; background: var(--hot); color: white; 
            font-size: 12px; padding: 5px 12px; border-radius: 10px; font-weight: 900; z-index: 10; 
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4); animation: pulse 2s infinite; 
        }
        
        .img-box { height: 170px; position: relative; overflow: hidden; background: #0f172a; }
        .p-img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .card:hover .p-img { transform: scale(1.15) rotate(2deg); }
        
        .info { padding: 18px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .title { font-size: 16px; font-weight: 800; color: white; line-height: 1.4; }
        .price { font-size: 20px; font-weight: 900; color: var(--accent); margin-top: auto; display:flex; align-items:center; gap:5px; text-shadow: 0 0 10px rgba(16,185,129,0.3); }
        .price small { font-size: 12px; color: #64748b; font-weight: 600; }
        
        .btn-add {
            background: var(--glass-strong); color: white; border: 1px solid var(--border); width: 100%; padding: 12px;
            border-radius: 16px; margin-top: 5px; font-weight: 800; cursor: pointer;
            font-family: 'Cairo'; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s;
        }
        .btn-add:hover { background: var(--primary); border-color: var(--primary); }

        /* Modals */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); z-index: 2000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .overlay.show { opacity: 1; }
        .modal { 
            background: #1e293b; width: 90%; max-width: 400px; padding: 35px; border-radius: 30px; 
            border: 1px solid var(--border); text-align: center; box-shadow: 0 25px 80px rgba(0,0,0,0.7); 
            transform: scale(0.9); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative;
        }
        .overlay.show .modal { transform: scale(1); }
        
        .inp { width: 100%; padding: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 16px; color: white; margin-bottom: 15px; font-family: 'Cairo'; font-weight: 700; font-size: 15px; transition: 0.3s; }
        .inp:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }
        
        .btn-confirm { 
            background: linear-gradient(135deg, var(--accent), #059669); color: white; border: none; width: 100%; 
            padding: 16px; border-radius: 18px; font-weight: 900; font-size: 16px; cursor: pointer; 
            margin-top: 15px; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.25); transition: 0.3s; 
        }
        .btn-confirm:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(16, 185, 129, 0.4); }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; text-decoration: none; box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4); z-index: 999; transition: 0.3s; }
        .fab:hover { transform: scale(1.1) rotate(10deg); }

        #toast-area { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; width: 90%; max-width: 420px; }
        .toast { 
            background: rgba(15, 23, 42, 0.98); padding: 18px; border-radius: 18px; border: 1px solid var(--border); 
            color: white; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; 
            backdrop-filter: blur(12px); animation: slideDown 0.4s; border-right: 5px solid var(--accent); 
            box-shadow: 0 15px 50px rgba(0,0,0,0.5); text-align: right;
        }
        @keyframes slideDown { from{transform: translateY(-20px); opacity: 0;} to{transform: translateY(0); opacity: 1;} }
        
        .loader { text-align: center; color: #94a3b8; padding: 50px; font-size: 20px; }

        /* Maintenance Mode */
        #maintenance-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; z-index: 9999; display: none;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        #maintenance-screen h1 { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
        #maintenance-screen p { color: #94a3b8; max-width: 300px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="maintenance-screen">
        <i class="fa-solid fa-person-digging" style="font-size: 80px; color: #facc15; margin-bottom: 20px;"></i>
        <h1>نحن في وضع الصيانة</h1>
        <p>نقوم حالياً بتحسينات على المتجر لخدمتكم بشكل أفضل. سنعود قريباً! 🚀</p>
    </div>

    <div id="app-content">
        <div id="toast-area"></div>

        <nav class="navbar">
            <div class="logo">
                <img src="https://placehold.co/100x100/6366f1/ffffff?text=D" id="nav-logo" alt="Logo">
                دكانك <span>ستور</span>
            </div>
            <div id="user-area">
                <button class="auth-btn" onclick="openAuth()">تسجيل الدخول <i class="fa-solid fa-arrow-left"></i></button>
            </div>
        </nav>

        <div class="news-bar"><div class="news-content" id="news-text">أهلاً بك في دكانك.. أفضل الخدمات الرقمية بأسرع وقت! 🚀</div></div>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" class="search-inp" id="search" placeholder="ابحث عن خدمة (ببجي، نتفلكس، شدات..)">
        </div>

        <div class="category-bar" id="category-container">
            <button class="cat-btn active" onclick="filterCat('all', this)">الكل</button>
        </div>

        <div class="container">
            <div class="grid" id="grid">
                <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري تحميل المنتجات...</div>
            </div>
        </div>

        <a href="https://wa.me/201552127091" target="_blank" class="fab"><i class="fa-brands fa-whatsapp"></i></a>
    </div>

    <div class="overlay" id="modal">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; margin-bottom:25px;">
                <h3 style="margin:0; font-size:22px; font-weight:900;">تفاصيل الطلب 📝</h3>
                <i class="fa-solid fa-xmark" onclick="closeM()" style="cursor:pointer; color:#94a3b8; font-size:24px;"></i>
            </div>
            
            <div style="background:#0f172a; padding:20px; border-radius:20px; margin-bottom:25px; border:1px solid #334155; text-align:center;">
                <div id="m-name" style="color:var(--primary); font-weight:bold; font-size:18px; margin-bottom:8px;">...</div>
                <div id="m-price" style="font-size:28px; color:var(--accent); font-weight:900;">...</div>
            </div>

            <input id="c-name" class="inp" placeholder="الاسم بالكامل" readonly style="opacity:0.7; cursor:not-allowed;">
            <input id="c-phone" type="tel" class="inp" placeholder="رقم الواتساب" readonly style="opacity:0.7; cursor:not-allowed;">
            
            <div class="coupon-box" style="display:flex; gap:10px; margin-bottom:15px;">
                <input id="c-code" class="inp" placeholder="كود خصم (اختياري)" style="margin:0">
                <button onclick="applyCode()" style="background:#334155; color:white; border:none; padding:0 25px; border-radius:16px; font-weight:bold; cursor:pointer; transition:0.2s;">تطبيق</button>
            </div>
            <p id="promo-res" style="font-size:13px; margin:-10px 0 20px; text-align:right; min-height:20px; font-weight:bold;"></p>

            <button class="btn-confirm" onclick="sendOrder()">إرسال الطلب الآن 🚀</button>
        </div>
    </div>

    <div class="overlay" id="auth-modal">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; margin-bottom:25px;">
                <h3 id="auth-title" style="margin:0; font-size:24px; font-weight:900;">تسجيل دخول 🔐</h3>
                <i class="fa-solid fa-xmark" onclick="closeAuth()" style="cursor:pointer; color:#94a3b8; font-size:24px;"></i>
            </div>

            <div id="login-form">
                <input id="l-phone" type="tel" class="inp" placeholder="رقم الهاتف (الأساسي)">
                <input id="l-pass" type="password" class="inp" placeholder="كلمة المرور">
                <button class="btn-confirm" onclick="userLogin()">دخول</button>
                <p style="margin-top:25px; font-size:14px; color:#cbd5e1;">ليس لديك حساب؟ <span style="color:var(--primary); cursor:pointer; font-weight:bold;" onclick="toggleAuthMode('signup')">أنشئ حساب جديد</span></p>
            </div>

            <div id="signup-form" style="display:none;">
                <input id="s-name" class="inp" placeholder="الاسم بالكامل">
                <input id="s-phone" type="tel" class="inp" placeholder="رقم الهاتف">
                <input id="s-pass" type="password" class="inp" placeholder="كلمة المرور">
                <button class="btn-confirm" onclick="userRegister()">إنشاء حساب</button>
                <p style="margin-top:25px; font-size:14px; color:#cbd5e1;">لديك حساب بالفعل؟ <span style="color:var(--primary); cursor:pointer; font-weight:bold;" onclick="toggleAuthMode('login')">تسجيل دخول</span></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, query, orderBy, onSnapshot, where, setDoc, getDoc } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTEMxOtRHtjf5z1UJd-efqf88F3g_w-S0",
            authDomain: "digital-store-af306.firebaseapp.com",
            projectId: "digital-store-af306",
            storageBucket: "digital-store-af306.firebasestorage.app",
            messagingSenderId: "388553846104",
            appId: "1:388553846104:web:828d6530380d3ab1eb892d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const DEFAULT_LOGO = "https://placehold.co/400x400/1e293b/6366f1?text=D";
        document.getElementById('nav-logo').src = DEFAULT_LOGO;
        
        let products = [], selected = null, finalP = 0;
        let currentUser = JSON.parse(localStorage.getItem('userData')) || null;

        // Maintenance Check
        onSnapshot(doc(db,"config","main"), s => { 
            if(s.exists()) {
                if(s.data().announcement) document.getElementById('news-text').innerText = s.data().announcement; 
                if(s.data().maintenance) {
                    document.getElementById('maintenance-screen').style.display = 'flex';
                    document.getElementById('app-content').style.display = 'none';
                } else {
                    document.getElementById('maintenance-screen').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                }
            } 
        });

        checkUserUI();

        // ------------------ Authentication ------------------
        window.openAuth = () => {
            const m = document.getElementById('auth-modal');
            m.style.display = 'flex';
            setTimeout(() => m.classList.add('show'), 10);
            toggleAuthMode('login');
        };
        window.closeAuth = () => {
            const m = document.getElementById('auth-modal');
            m.classList.remove('show');
            setTimeout(() => m.style.display = 'none', 300);
        };

        window.toggleAuthMode = (mode) => {
            if(mode === 'signup') {
                document.getElementById('auth-title').innerText = "حساب جديد ✨";
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
            } else {
                document.getElementById('auth-title').innerText = "تسجيل دخول 🔐";
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('signup-form').style.display = 'none';
            }
        };

        window.userRegister = async () => {
            const n = document.getElementById('s-name').value;
            const p = document.getElementById('s-phone').value;
            const pass = document.getElementById('s-pass').value;

            if(!n || !p || !pass) return alert("يرجى ملء جميع البيانات");
            const docRef = doc(db, "users", p);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) { alert("هذا الرقم مسجل بالفعل!"); return; }

            await setDoc(doc(db, "users", p), { name: n, password: pass, phone: p, joined: new Date().toISOString() });
            currentUser = { name: n, phone: p };
            localStorage.setItem('userData', JSON.stringify(currentUser));
            alert("تم إنشاء الحساب بنجاح! 🎉"); checkUserUI(); closeAuth();
        };

        window.userLogin = async () => {
            const p = document.getElementById('l-phone').value;
            const pass = document.getElementById('l-pass').value;
            if(!p || !pass) return alert("يرجى إدخال البيانات");

            const docRef = doc(db, "users", p);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists() && docSnap.data().password === pass) {
                currentUser = { name: docSnap.data().name, phone: p };
                localStorage.setItem('userData', JSON.stringify(currentUser));
                checkUserUI(); closeAuth();
                showToast('success', `مرحباً بك، ${currentUser.name}`);
            } else {
                alert("رقم الهاتف أو كلمة المرور غير صحيحة ❌");
            }
        };

        window.userLogout = () => {
            if(!confirm("هل تريد تسجيل الخروج؟")) return;
            localStorage.removeItem('userData'); currentUser = null; checkUserUI();
        };

        function checkUserUI() {
            const area = document.getElementById('user-area');
            if(currentUser) {
                area.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div style="text-align:right; line-height:1.2;">
                            <div style="font-size:11px; color:#94a3b8; font-weight:600;">مرحباً</div>
                            <div style="font-weight:800; font-size:15px;">${currentUser.name}</div>
                        </div>
                        <button onclick="userLogout()" style="background:rgba(239,68,68,0.1); border:1px solid #ef4444; color:#ef4444; width:40px; height:40px; border-radius:12px; cursor:pointer; transition:0.3s;"><i class="fa-solid fa-power-off"></i></button>
                    </div>`;
            } else {
                area.innerHTML = `<button class="auth-btn" onclick="openAuth()">تسجيل الدخول <i class="fa-solid fa-arrow-left"></i></button>`;
            }
        }

        // ------------------ Categories & Products ------------------
        onSnapshot(collection(db, "categories"), s => {
            const bar = document.getElementById('category-container');
            bar.innerHTML = '<button class="cat-btn active" onclick="window.filterCat(\'all\', this)">الكل</button>';
            s.forEach(d => {
                bar.innerHTML += `<button class="cat-btn" onclick="window.filterCat('${d.data().name}', this)">${d.data().name}</button>`;
            });
        });

        onSnapshot(query(collection(db,"products"), orderBy("date","desc")), s => {
            const g = document.getElementById('grid'); g.innerHTML=""; products=[];
            if(s.empty) { g.innerHTML="<p style='color:#94a3b8; width:100%; text-align:center;'>لا توجد منتجات حالياً</p>"; return; }
            s.forEach(d => {
                const p = d.data(); p.id = d.id; products.push(p);
                const img = p.image || DEFAULT_LOGO;
                const hot = p.isHot ? '<div class="hot-badge">HOT 🔥</div>' : '';
                // Ensure owner is set for routing
                const owner = p.owner || 'Main'; 
                g.innerHTML += `
                    <div class="card" data-t="${p.title}" data-cat="${p.category || 'all'}" data-owner="${owner}">
                        ${hot}
                        <div class="img-box"><img src="${img}" class="p-img" onerror="this.src='${DEFAULT_LOGO}'"></div>
                        <div class="info">
                            <div class="title">${p.title}</div>
                            <div class="price">${p.price} <small>ج.م</small></div>
                            <button class="btn-add" onclick="openM('${p.title}',${p.price}, '${owner}')">طلب الخدمة <i class="fa-solid fa-cart-shopping"></i></button>
                        </div>
                    </div>
                `;
            });
        });

        window.filterCat = (catName, btn) => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.card').forEach(card => {
                const cardCat = card.getAttribute('data-cat');
                if(catName === 'all' || cardCat === catName) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        };

        document.getElementById('search').addEventListener('input', (e) => {
            const v = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => c.style.display = c.getAttribute('data-t').toLowerCase().includes(v) ? 'flex' : 'none');
        });

        // ------------------ Orders & Logic ------------------
        window.openM = (t, p, owner) => {
            if(!currentUser) { alert("يرجى تسجيل الدخول أولاً لطلب الخدمة 🔒"); openAuth(); return; }

            selected = {t, p, owner}; finalP = p;
            document.getElementById('m-name').innerText = t;
            document.getElementById('m-price').innerText = p + " ج.م";
            document.getElementById('c-code').value = "";
            document.getElementById('promo-res').innerText = "";
            document.getElementById('c-name').value = currentUser.name;
            document.getElementById('c-phone').value = currentUser.phone;

            const m = document.getElementById('modal');
            m.style.display = 'flex'; setTimeout(() => m.classList.add('show'), 10);
        };

        window.closeM = () => {
            const m = document.getElementById('modal');
            m.classList.remove('show'); setTimeout(() => m.style.display = 'none', 300);
        };

        window.applyCode = async () => {
            const c = document.getElementById('c-code').value;
            const s = await getDocs(query(collection(db,"promocodes"), where("code","==",c)));
            if(!s.empty) {
                const d = Number(s.docs[0].data().amount);
                finalP = Math.max(0, selected.p - d);
                document.getElementById('m-price').innerHTML = `<s style='color:#666; font-size:20px'>${selected.p}</s> ${finalP} ج.م`;
                document.getElementById('promo-res').innerHTML = `<span style='color:#10b981'>تم خصم ${d} جنيه بنجاح! 🎉</span>`;
            } else {
                document.getElementById('promo-res').innerHTML = `<span style='color:#ef4444'>الكود غير صحيح ❌</span>`;
            }
        };

        window.sendOrder = async () => {
            const n=document.getElementById('c-name').value, p=document.getElementById('c-phone').value;
            if(!n||!p) return alert("يرجى التأكد من البيانات");
            
            const btn = document.querySelector('.btn-confirm'); 
            const originalText = btn.innerText;
            btn.innerText="جاري الإرسال..."; btn.disabled=true;
            
            // Unique ID Generation
            const oid = "ORD-" + Math.floor(100000 + Math.random() * 900000);

            try {
                const ref = await addDoc(collection(db,"orders"), {
                    orderId: oid,
                    customerName:n, 
                    customerPhone:p, 
                    product:selected.t, 
                    price:finalP, 
                    orderOwner: selected.owner, // Crucial for Routing
                    date: new Date().toLocaleString('ar-EG'), 
                    status:'new', 
                    settled:false,
                    adminNotes: ""
                });
                const my = JSON.parse(localStorage.getItem('myOrders')||'[]'); my.push(ref.id);
                localStorage.setItem('myOrders',JSON.stringify(my)); listenOrders();
                
                alert(`تم استلام طلبك بنجاح سوف يتم التواصل معك في اقرب وقت علي رقمك المسجل لدينا ! ✅\nرقم الطلب: ${oid}`);
                closeM();
            } catch(e){ alert("حدث خطأ في الاتصال"); }
            btn.innerText=originalText; btn.disabled=false;
        };

        function listenOrders() {
            const my = JSON.parse(localStorage.getItem('myOrders')||'[]');
            my.forEach(id => onSnapshot(doc(db,"orders",id), d => {
                if(d.exists() && d.data().status !== 'new') notify(d.data());
            }));
        }
        listenOrders();

        // ------------------ FEATURE: Dynamic Completion Message ------------------
        function notify(order) {
            const st = order.status;
            const prod = order.product;
            
            // Prevent duplicate toasts using sessionStorage
            if(sessionStorage.getItem('s_'+prod) === st) return;
            sessionStorage.setItem('s_'+prod, st);

            if(st === 'done') {
                // Dynamically fetch phone from current user session or fallback to order details
                const targetPhone = currentUser ? currentUser.phone : (order.customerPhone || "المسجل");

                showToast('done', `
                    <b>تم تنفيذ الطلب بنجاح! ✅</b><br>
                    Your order has been completed. We will contact you on your registered phone number: 
                    <span style="font-family:monospace; color:#10b981; direction:ltr; display:inline-block; font-weight:bold; background:rgba(16,185,129,0.1); padding:2px 6px; border-radius:4px;">
                        ${targetPhone}
                    </span>
                `);
            } else if(st === 'cancel') {
                showToast('error', `<b>تم إلغاء الطلب ❌</b><br>نأسف لذلك، يرجى مراجعة الدعم.`);
            } else {
                showToast('info', `<b>جاري تنفيذ طلبك... ⏳</b><br>${prod}`);
            }
        }

        function showToast(type, html) {
            const d = document.createElement('div'); d.className='toast';
            let icon = 'fa-bell'; let color = '#facc15';
            if(type==='done' || type==='success') { icon='fa-circle-check'; color='#10b981'; d.style.borderRightColor='#10b981'; }
            if(type==='error') { icon='fa-circle-xmark'; color='#ef4444'; d.style.borderRightColor='#ef4444'; }
            
            d.innerHTML = `<i class="fa-solid ${icon}" style="color:${color}; font-size:20px;"></i> <div>${html}</div>`;
            document.getElementById('toast-area').appendChild(d);
            setTimeout(()=>d.remove(), 7000);
        }

        window.openM=window.openM; window.closeM=window.closeM; window.sendOrder=window.sendOrder; window.applyCode=window.applyCode; window.filterCat=window.filterCat;
        window.openAuth=window.openAuth; window.closeAuth=window.closeAuth; window.toggleAuthMode=window.toggleAuthMode;
        window.userRegister=window.userRegister; window.userLogin=window.userLogin; window.userLogout=window.userLogout;
    </script>
</body>
</html>
