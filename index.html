<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دكانك | Dokkanak</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --secondary: #a855f7; --dark: #0f172a;
            --glass: rgba(30, 41, 59, 0.75); --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc; --accent: #10b981; --hot: #ef4444;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: #020617; color: var(--text); padding-bottom: 100px; overflow-x: hidden; }

        /* خلفية متحركة */
        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 50%), radial-gradient(circle, rgba(168,85,247,0.05) 100%, transparent 50%);
            animation: bgMove 20s infinite linear; z-index: -1;
        }
        @keyframes bgMove { 0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);} }

        /* Navbar */
        .navbar {
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px);
            padding: 15px 20px; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .logo { font-size: 20px; font-weight: 900; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display:flex; align-items:center; gap:8px;}
        .logo img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--primary); }

        /* Marquee */
        .news-bar { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: white; padding: 6px 0; font-size: 12px; font-weight: bold; overflow: hidden; white-space: nowrap; }
        .news-content { display: inline-block; animation: marquee 20s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        /* Search */
        .search-container { padding: 20px 15px; position: relative; max-width: 600px; margin: 0 auto; }
        .search-inp {
            width: 100%; padding: 12px 45px 12px 15px; border-radius: 15px; border: 1px solid var(--glass-border);
            background: var(--glass); color: white; font-family: 'Cairo'; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s;
        }
        .search-inp:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
        .search-icon { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

        /* Grid */
        .container { padding: 0 15px; max-width: 1000px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .card {
            background: var(--glass); border-radius: 16px; border: 1px solid var(--glass-border);
            overflow: hidden; position: relative; transition: transform 0.3s;
            display: flex; flex-direction: column; backdrop-filter: blur(10px);
        }
        .card:active { transform: scale(0.98); border-color: var(--primary); }
        
        .hot-badge { position: absolute; top: 10px; left: 10px; background: var(--hot); color: white; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: bold; z-index: 10; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); animation: pulse 2s infinite; }
        
        .img-box { height: 140px; position: relative; overflow: hidden; background: #0f172a; display: flex; align-items: center; justify-content: center; }
        .p-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        
        .info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 14px; font-weight: 700; margin-bottom: 5px; color: white; line-height: 1.3; }
        .price { font-size: 16px; font-weight: 900; color: var(--accent); margin-top: auto; }
        
        .btn-add {
            background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; border: none; width: 100%; padding: 8px;
            border-radius: 10px; margin-top: 10px; font-weight: bold; cursor: pointer;
            font-family: 'Cairo'; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        /* Modal */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal { background: #1e293b; width: 90%; max-width: 350px; padding: 25px; border-radius: 20px; border: 1px solid var(--glass-border); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6); position: relative; }
        
        .inp { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; margin-bottom: 12px; font-family: 'Cairo'; font-weight: 600; }
        .inp:focus { border-color: var(--primary); }
        
        .btn-confirm { background: var(--accent); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        /* Coupon */
        .coupon-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-cpn { background: #334155; color: white; border: none; padding: 0 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-family: 'Cairo'; }

        /* FAB */
        .fab { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; text-decoration: none; box-shadow: 0 0 20px rgba(37, 211, 102, 0.4); z-index: 999; animation: pulse 2s infinite; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }

        /* Toast */
        #toast-area { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; width: 90%; max-width: 400px; }
        .toast { background: rgba(30, 41, 59, 0.95); padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); color: white; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px); animation: slideDown 0.4s; border-right: 4px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        @keyframes slideDown { from{transform: translateY(-20px); opacity: 0;} to{transform: translateY(0); opacity: 1;} }
        
        .loader { text-align: center; color: #94a3b8; padding: 40px; }
    </style>
</head>
<body>

    <div id="toast-area"></div>

    <nav class="navbar">
        <div class="logo">
            <img src="https://placehold.co/100x100/6366f1/ffffff?text=D" id="nav-logo" alt="Logo">
            دكانك <span>ستور</span>
        </div>
    </nav>

    <div class="news-bar"><div class="news-content" id="news-text">أهلاً بك في دكانك.. أفضل الخدمات الرقمية بأسرع وقت! 🚀</div></div>

    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-inp" id="search" placeholder="ابحث عن الخدمة (ببجي، تيك توك..)">
    </div>

    <div class="container">
        <div class="grid" id="grid">
            <div class="loader"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل...</div>
        </div>
    </div>

    <a href="https://wa.me/201552127091" target="_blank" class="fab"><i class="fa-brands fa-whatsapp"></i></a>

    <div class="overlay" id="modal">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3 style="margin:0;">طلب خدمة 📝</h3>
                <i class="fa-solid fa-xmark" onclick="closeM()" style="cursor:pointer; color:#94a3b8; font-size:20px;"></i>
            </div>
            
            <div style="background:#0f172a; padding:12px; border-radius:12px; margin-bottom:20px; border:1px solid #334155;">
                <div id="m-name" style="color:var(--primary); font-weight:bold; font-size:14px;">...</div>
                <div id="m-price" style="font-size:18px; color:var(--accent); font-weight:900;">...</div>
            </div>

            <input id="c-name" class="inp" placeholder="الاسم بالكامل">
            <input id="c-phone" type="tel" class="inp" placeholder="رقم الواتساب للتواصل">
            
            <div class="coupon-box">
                <input id="c-code" class="inp" placeholder="كود خصم (اختياري)" style="margin:0">
                <button class="btn-cpn" onclick="applyCode()">تطبيق</button>
            </div>
            <p id="promo-res" style="font-size:11px; margin:-10px 0 15px; text-align:right;"></p>

            <button class="btn-confirm" onclick="sendOrder()">تأكيد الطلب ✅</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, query, orderBy, onSnapshot, where } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTEMxOtRHtjf5z1UJd-efqf88F3g_w-S0",
            authDomain: "digital-store-af306.firebaseapp.com",
            projectId: "digital-store-af306",
            storageBucket: "digital-store-af306.firebasestorage.app",
            messagingSenderId: "388553846104",
            appId: "1:388553846104:web:828d6530380d3ab1eb892d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const DEFAULT_LOGO = "https://placehold.co/400x400/1e293b/6366f1?text=D";
        document.getElementById('nav-logo').src = DEFAULT_LOGO;
        
        let products = [], selected = null, finalP = 0;

        // Load Settings
        onSnapshot(doc(db,"config","main"), s => { if(s.exists() && s.data().announcement) document.getElementById('news-text').innerText = s.data().announcement; });

        // Load Products
        onSnapshot(query(collection(db,"products"), orderBy("date","desc")), s => {
            const g = document.getElementById('grid'); g.innerHTML=""; products=[];
            if(s.empty) { g.innerHTML="<p style='color:#94a3b8; width:100%; text-align:center;'>لا توجد منتجات حالياً</p>"; return; }
            s.forEach(d => {
                const p = d.data(); p.id = d.id; products.push(p);
                const img = p.image || DEFAULT_LOGO;
                const hot = p.isHot ? '<div class="hot-badge">HOT 🔥</div>' : '';
                g.innerHTML += `
                    <div class="card" data-t="${p.title}">
                        ${hot}
                        <div class="img-box"><img src="${img}" class="p-img" onerror="this.src='${DEFAULT_LOGO}'"></div>
                        <div class="info">
                            <div class="title">${p.title}</div>
                            <div class="price">${p.price} ج.م</div>
                            <button class="btn-add" onclick="openM('${p.title}',${p.price})">طلب الخدمة <i class="fa-solid fa-cart-shopping"></i></button>
                        </div>
                    </div>
                `;
            });
        });

        // Search
        document.getElementById('search').addEventListener('input', (e) => {
            const v = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => c.style.display = c.getAttribute('data-t').toLowerCase().includes(v) ? 'flex' : 'none');
        });

        // Modal
        window.openM = (t, p) => {
            selected = {t, p}; finalP = p;
            document.getElementById('m-name').innerText = t;
            document.getElementById('m-price').innerText = p + " ج.م";
            document.getElementById('c-code').value = "";
            document.getElementById('promo-res').innerText = "";
            document.getElementById('modal').style.display = 'flex';
        };
        window.closeM = () => document.getElementById('modal').style.display='none';

        // Coupon
        window.applyCode = async () => {
            const c = document.getElementById('c-code').value;
            const s = await getDocs(query(collection(db,"promocodes"), where("code","==",c)));
            if(!s.empty) {
                const d = Number(s.docs[0].data().amount);
                finalP = Math.max(0, selected.p - d);
                document.getElementById('m-price').innerHTML = `<s style='color:#666; font-size:14px'>${selected.p}</s> ${finalP} ج.م`;
                document.getElementById('promo-res').innerHTML = `<span style='color:#10b981'>تم خصم ${d} جنيه بنجاح! 🎉</span>`;
            } else {
                document.getElementById('promo-res').innerHTML = `<span style='color:#ef4444'>الكود غير صحيح ❌</span>`;
            }
        };

        // Submit (With New Alert Message)
        window.sendOrder = async () => {
            const n=document.getElementById('c-name').value, p=document.getElementById('c-phone').value;
            if(!n||!p) return alert("يرجى كتابة الاسم ورقم الواتساب");
            
            const btn = document.querySelector('.btn-confirm'); 
            btn.innerText="جاري الإرسال..."; btn.disabled=true;

            try {
                const ref = await addDoc(collection(db,"orders"), {
                    customerName:n, customerPhone:p, product:selected.t, price:finalP, 
                    date: new Date().toLocaleString('ar-EG'), status:'new', settled:false
                });
                
                const my = JSON.parse(localStorage.getItem('myOrders')||'[]'); my.push(ref.id);
                localStorage.setItem('myOrders',JSON.stringify(my)); listenOrders();
                
                // الرسالة المطلوبة بالتحديد
                alert(`تم استلام طلبك بنجاح! ✅\nسيتم التواصل معك علي الرقم: ${p}`);
                closeM();
                document.getElementById('c-name').value=""; document.getElementById('c-phone').value="";
            } catch(e){ alert("حدث خطأ في الاتصال"); }
            btn.innerText="تأكيد الطلب ✅"; btn.disabled=false;
        };

        // Notifications
        function listenOrders() {
            const my = JSON.parse(localStorage.getItem('myOrders')||'[]');
            my.forEach(id => onSnapshot(doc(db,"orders",id), d => {
                if(d.exists() && d.data().status !== 'new') notify(d.data().status, d.data().product);
            }));
        }
        listenOrders();

        function notify(st, prod) {
            if(sessionStorage.getItem('s_'+prod) === st) return;
            sessionStorage.setItem('s_'+prod, st);
            const msg = st==='done'?'تم تنفيذ طلبك بنجاح ✅':(st==='cancel'?'للأسف تم إلغاء طلبك ❌':'طلبك قيد التنفيذ الآن.. ⏳');
            const d = document.createElement('div'); d.className='toast';
            d.innerHTML = `<i class="fa-solid fa-bell" style="color:#facc15"></i> <div><b>تحديث حالة الطلب:</b><br>${msg}<br><small style="opacity:0.7">${prod}</small></div>`;
            document.getElementById('toast-area').appendChild(d);
            setTimeout(()=>d.remove(), 6000);
        }

        window.openM=window.openM; window.closeM=window.closeM; window.sendOrder=window.sendOrder; window.applyCode=window.applyCode;
    </script>
</body>
</html>
